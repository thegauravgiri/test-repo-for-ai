<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blooming Flower</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #1b2a4a 0%, #0a1128 70%, #05060f 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene {
    position: relative;
    width: 500px;
    height: 500px;
  }

  .stem {
    position: absolute;
    left: 50%;
    top: 55%;
    width: 10px;
    height: 220px;
    background: linear-gradient(to bottom, #3f8f3f, #2c6b2c);
    border-radius: 6px;
    transform: translateX(-50%);
    transform-origin: top center;
  }

  .leaf {
    position: absolute;
    width: 60px;
    height: 30px;
    background: #3f9142;
    border-radius: 0 100% 0 100%;
    top: 62%;
    left: 50%;
    animation: leafGrow 2s ease-out forwards;
    transform-origin: left center;
  }

  .leaf.left {
    transform: translate(-100%, 0) rotate(20deg) scale(0);
    animation-delay: 1.2s;
  }

  .leaf.right {
    transform: translate(0, 0) rotate(-20deg) scaleX(-1) scale(0);
    animation-delay: 1.5s;
  }

  @keyframes leafGrow {
    0% { transform: translate(-100%, 0) rotate(20deg) scale(0); opacity: 0; }
    100% { transform: translate(-100%, 0) rotate(20deg) scale(1); opacity: 1; }
  }

  .leaf.right {
    animation-name: leafGrowRight;
  }

  @keyframes leafGrowRight {
    0% { transform: translate(0, 0) rotate(-20deg) scaleX(-1) scale(0); opacity: 0; }
    100% { transform: translate(0, 0) rotate(-20deg) scaleX(-1) scale(1); opacity: 1; }
  }

  .flower {
    position: absolute;
    left: 50%;
    top: 55%;
    width: 0;
    height: 0;
    transform: translate(-50%, -50%);
  }

  .petal {
    position: absolute;
    width: 60px;
    height: 110px;
    background: linear-gradient(to top, #ff6fa5, #ffc1dd 60%, #fff0f6);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
    animation: bloom 3s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay: 2s;
    opacity: 0;
    box-shadow: 0 0 12px rgba(255, 111, 165, 0.35);
  }

  @keyframes bloom {
    0% {
      transform: translate(-50%, -100%) rotate(var(--angle)) scale(0.1);
      opacity: 0;
    }
    60% {
      opacity: 1;
    }
    100% {
      transform: translate(-50%, -100%) rotate(var(--angle)) translateY(-10px) scale(1);
      opacity: 1;
    }
  }

  .center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 46px;
    height: 46px;
    background: radial-gradient(circle at 35% 35%, #ffe066, #f7b733 70%, #e08e0b);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    box-shadow: 0 0 20px rgba(255, 210, 90, 0.6);
    animation: popCenter 1s ease-out forwards;
    animation-delay: 4.2s;
    z-index: 5;
  }

  @keyframes popCenter {
    0% { transform: translate(-50%, -50%) scale(0); }
    70% { transform: translate(-50%, -50%) scale(1.2); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  .dot {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #b5730a;
    border-radius: 50%;
  }

  .caption {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
    color: #e8e8f5;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    opacity: 0;
    animation: fadeIn 1.5s ease-out forwards;
    animation-delay: 5s;
  }

  @keyframes fadeIn {
    to { opacity: 0.85; }
  }

  .petals-shadow {
    position: absolute;
    left: 50%;
    top: 62%;
    width: 140px;
    height: 30px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.35), transparent 70%);
    transform: translate(-50%, 0);
    filter: blur(4px);
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="petals-shadow"></div>
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    <div class="flower" id="flower"></div>
    <div class="caption">a flower blooms in its own time 🌸</div>
  </div>

  <script>
    const flower = document.getElementById('flower');
    const petalCount = 10;

    for (let i = 0; i < petalCount; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      const angle = (360 / petalCount) * i;
      petal.style.setProperty('--angle', angle + 'deg');
      petal.style.animationDelay = (2 + i * 0.08) + 's';
      flower.appendChild(petal);
    }

    const center = document.createElement('div');
    center.className = 'center';
    flower.appendChild(center);

    for (let i = 0; i < 12; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      const r = 10 + Math.random() * 10;
      const a = Math.random() * Math.PI * 2;
      dot.style.left = `calc(50% + ${Math.cos(a) * r}px - 2px)`;
      dot.style.top = `calc(50% + ${Math.sin(a) * r}px - 2px)`;
      dot.style.opacity = '0';
      dot.style.transition = 'opacity 0.6s ease-out';
      dot.style.transitionDelay = (4.6 + Math.random() * 0.6) + 's';
      center.appendChild(dot);
      requestAnimationFrame(() => requestAnimationFrame(() => dot.style.opacity = '1'));
    }
  </script>
</body>
</html>
