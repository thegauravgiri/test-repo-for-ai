<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon Face</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background: #eaf6ff;
  }

  .face {
    position: relative;
    width: 320px;
    height: 320px;
    background: #00a0de;
    border-radius: 50%;
    border: 6px solid #1a1a1a;
    box-sizing: border-box;
  }

  .face-white {
    position: absolute;
    top: 60px;
    left: 20px;
    width: 280px;
    height: 240px;
    background: #ffffff;
    border-radius: 50%;
    border: 6px solid #1a1a1a;
  }

  .eye {
    position: absolute;
    top: 20px;
    width: 55px;
    height: 70px;
    background: #ffffff;
    border: 5px solid #1a1a1a;
    border-radius: 50%;
  }

  .eye.left { left: 55px; }
  .eye.right { right: 55px; }

  .pupil {
    position: absolute;
    bottom: 14px;
    right: 12px;
    width: 12px;
    height: 16px;
    background: #1a1a1a;
    border-radius: 50%;
  }

  .nose {
    position: absolute;
    top: 78px;
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 34px;
    background: #ff0000;
    border: 5px solid #1a1a1a;
    border-radius: 50%;
  }

  .nose-line {
    position: absolute;
    top: 95px;
    left: 50%;
    width: 5px;
    height: 90px;
    background: #1a1a1a;
    transform: translateX(-50%);
  }

  .mouth {
    position: absolute;
    top: 185px;
    left: 50%;
    width: 200px;
    height: 100px;
    border: 5px solid #1a1a1a;
    border-top: none;
    border-radius: 0 0 100px 100px;
    transform: translateX(-50%);
  }

  .whiskers {
    position: absolute;
    width: 90px;
    height: 4px;
    background: #1a1a1a;
  }

  .whiskers.left-1 { top: 150px; left: -70px; }
  .whiskers.left-2 { top: 170px; left: -75px; }
  .whiskers.left-3 { top: 190px; left: -70px; }

  .whiskers.right-1 { top: 150px; right: -70px; }
  .whiskers.right-2 { top: 170px; right: -75px; }
  .whiskers.right-3 { top: 190px; right: -70px; }

  .collar {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    height: 30px;
    background: #ff0000;
    border: 5px solid #1a1a1a;
    border-radius: 0 0 20px 20px;
  }

  .bell {
    position: absolute;
    bottom: -34px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 40px;
    background: #ffd700;
    border: 5px solid #1a1a1a;
    border-radius: 50%;
  }

  .bell::before {
    content: "";
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 10px;
    background: #1a1a1a;
  }

  .bell::after {
    content: "";
    position: absolute;
    top: 12px;
    left: 8px;
    width: 24px;
    height: 5px;
    background: #1a1a1a;
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="face">
  <div class="whiskers left-1"></div>
  <div class="whiskers left-2"></div>
  <div class="whiskers left-3"></div>
  <div class="whiskers right-1"></div>
  <div class="whiskers right-2"></div>
  <div class="whiskers right-3"></div>

  <div class="face-white">
    <div class="eye left">
      <div class="pupil"></div>
    </div>
    <div class="eye right">
      <div class="pupil"></div>
    </div>
    <div class="nose"></div>
    <div class="nose-line"></div>
    <div class="mouth"></div>
  </div>

  <div class="collar"></div>
  <div class="bell"></div>
</div>

</body>
</html>
