<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doraemon and Nobita</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 110px;
    min-height: 100vh;
    margin: 0;
    background: #eaf6ff;
  }

  .face {
    position: relative;
    width: 320px;
    height: 320px;
    background: #00a0de;
    border-radius: 50%;
    border: 6px solid #1a1a1a;
    box-sizing: border-box;
  }

  .face-white {
    position: absolute;
    top: 60px;
    left: 20px;
    width: 280px;
    height: 240px;
    background: #ffffff;
    border-radius: 50%;
    border: 6px solid #1a1a1a;
  }

  .eye {
    position: absolute;
    top: 20px;
    width: 55px;
    height: 70px;
    background: #ffffff;
    border: 5px solid #1a1a1a;
    border-radius: 50%;
  }

  .eye.left { left: 55px; }
  .eye.right { right: 55px; }

  .pupil {
    position: absolute;
    bottom: 14px;
    right: 12px;
    width: 12px;
    height: 16px;
    background: #1a1a1a;
    border-radius: 50%;
  }

  .nose {
    position: absolute;
    top: 78px;
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 34px;
    background: #ff0000;
    border: 5px solid #1a1a1a;
    border-radius: 50%;
  }

  .nose-line {
    position: absolute;
    top: 95px;
    left: 50%;
    width: 5px;
    height: 90px;
    background: #1a1a1a;
    transform: translateX(-50%);
  }

  .mouth {
    position: absolute;
    top: 185px;
    left: 50%;
    width: 200px;
    height: 100px;
    border: 5px solid #1a1a1a;
    border-top: none;
    border-radius: 0 0 100px 100px;
    transform: translateX(-50%);
  }

  .whiskers {
    position: absolute;
    width: 90px;
    height: 4px;
    background: #1a1a1a;
  }

  .whiskers.left-1 { top: 150px; left: -70px; }
  .whiskers.left-2 { top: 170px; left: -75px; }
  .whiskers.left-3 { top: 190px; left: -70px; }

  .whiskers.right-1 { top: 150px; right: -70px; }
  .whiskers.right-2 { top: 170px; right: -75px; }
  .whiskers.right-3 { top: 190px; right: -70px; }

  .collar {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    height: 30px;
    background: #ff0000;
    border: 5px solid #1a1a1a;
    border-radius: 0 0 20px 20px;
  }

  .bell {
    position: absolute;
    bottom: -34px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 40px;
    background: #ffd700;
    border: 5px solid #1a1a1a;
    border-radius: 50%;
  }

  .bell::before {
    content: "";
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 10px;
    background: #1a1a1a;
  }

  .bell::after {
    content: "";
    position: absolute;
    top: 12px;
    left: 8px;
    width: 24px;
    height: 5px;
    background: #1a1a1a;
    border-radius: 2px;
  }

  .nobita-face {
    position: relative;
    z-index: 0;
    width: 260px;
    height: 280px;
    background: #ffdcb0;
    border-radius: 50%;
    border: 6px solid #1a1a1a;
    box-sizing: border-box;
  }

  .nobita-ear {
    position: absolute;
    top: 110px;
    width: 34px;
    height: 44px;
    background: #ffdcb0;
    border: 5px solid #1a1a1a;
    border-radius: 50%;
    z-index: -1;
  }

  .nobita-ear.left { left: -18px; }
  .nobita-ear.right { right: -18px; }

  .nobita-hair {
    position: absolute;
    top: -8px;
    left: -6px;
    width: 260px;
    height: 150px;
    background: #1a1a1a;
    border-radius: 50% 50% 40% 40% / 60% 60% 20% 20%;
  }

  .nobita-hair-tuft {
    position: absolute;
    top: -22px;
    left: 118px;
    width: 14px;
    height: 30px;
    background: #1a1a1a;
    border-radius: 40% 60% 0 0;
    transform: rotate(8deg);
  }

  .nobita-glasses {
    position: absolute;
    top: 118px;
    left: 30px;
    width: 200px;
    height: 60px;
  }

  .nobita-lens {
    position: absolute;
    top: 0;
    width: 65px;
    height: 60px;
    background: rgba(255, 255, 255, 0.5);
    border: 5px solid #1a1a1a;
    border-radius: 50%;
  }

  .nobita-lens.left { left: 0; }
  .nobita-lens.right { right: 0; }

  .nobita-bridge {
    position: absolute;
    top: 26px;
    left: 65px;
    width: 70px;
    height: 5px;
    background: #1a1a1a;
  }

  .nobita-pupil {
    position: absolute;
    top: 24px;
    width: 10px;
    height: 12px;
    background: #1a1a1a;
    border-radius: 50%;
  }

  .nobita-pupil.left { left: 28px; }
  .nobita-pupil.right { right: 28px; }

  .nobita-nose {
    position: absolute;
    top: 178px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 10px;
    background: #1a1a1a;
    border-radius: 50%;
  }

  .nobita-mouth {
    position: absolute;
    top: 205px;
    left: 50%;
    width: 50px;
    height: 25px;
    border: 4px solid #1a1a1a;
    border-top: none;
    border-radius: 0 0 25px 25px;
    transform: translateX(-50%);
  }
</style>
</head>
<body>

<div class="face">
  <div class="whiskers left-1"></div>
  <div class="whiskers left-2"></div>
  <div class="whiskers left-3"></div>
  <div class="whiskers right-1"></div>
  <div class="whiskers right-2"></div>
  <div class="whiskers right-3"></div>

  <div class="face-white">
    <div class="eye left">
      <div class="pupil"></div>
    </div>
    <div class="eye right">
      <div class="pupil"></div>
    </div>
    <div class="nose"></div>
    <div class="nose-line"></div>
    <div class="mouth"></div>
  </div>

  <div class="collar"></div>
  <div class="bell"></div>
</div>

<div class="nobita-face">
  <div class="nobita-ear left"></div>
  <div class="nobita-ear right"></div>
  <div class="nobita-hair"></div>
  <div class="nobita-hair-tuft"></div>

  <div class="nobita-glasses">
    <div class="nobita-lens left">
      <div class="nobita-pupil left"></div>
    </div>
    <div class="nobita-lens right">
      <div class="nobita-pupil right"></div>
    </div>
    <div class="nobita-bridge"></div>
  </div>

  <div class="nobita-nose"></div>
  <div class="nobita-mouth"></div>
</div>

</body>
</html>
